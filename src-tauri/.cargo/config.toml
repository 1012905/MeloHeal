[target.x86_64-pc-windows-msvc]
# 使用 Visual Studio Build Tools 的 MSVC linker
# 首次运行前需设置环境变量 LIB 和 INCLUDE（参考同级 msvc-env.sh）
linker = "C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Tools\\MSVC\\14.44.35207\\bin\\Hostx64\\x64\\link.exe"
rustflags = []

[build]
# 并行编译任务数（留空 = 自动检测 CPU 核数）
# 启用增量编译（加速二次构建）
incremental = true

[profile.dev]
# 完整调试信息（支持变量 inspect）+ 极致并行
debug = 2
codegen-units = 256

# release：极致运行性能
[profile.release]
opt-level = 3
debug = 0
codegen-units = 1
strip = "symbols"
lto = "fat"